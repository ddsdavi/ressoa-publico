# Cada função pública declarada com o entrypoint apontando para app/functions.
# Sem a entrada aqui, o CLI procura supabase/functions/<nome> (que não existe
# neste repositório) e o deploy falha com "Entrypoint path does not exist".
[functions.venda]
verify_jwt = false
entrypoint = "../app/functions/venda/index.ts"

